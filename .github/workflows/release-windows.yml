name: Build & Publish Windows One-Click Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Windows packager
        run: npm install --no-save electron electron-builder

      - name: Build web assets
        run: npm run build

      - name: Build & Publish One-Click Windows .exe (Release Tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --config electron-builder.yml --publish always

      - name: Build One-Click Windows .exe (Manual Run)
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: npx electron-builder --win --config electron-builder.yml --publish never

      - name: Upload Windows .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kinetix-windows-installer
          path: release/*.exe
          if-no-files-found: error
