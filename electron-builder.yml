appId: com.kinetix.gymops
productName: Kinetix
copyright: Copyright © 2026 Kinetix
asar: false
npmRebuild: false
directories:
  output: release
files:
  - dist/**/*
  - dist-server/**/*
  - electron/**/*
  - package.json
  - "!**/.env*"
  - "!release/**/*"
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Kinetix-Setup-${version}.exe
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
publish:
  provider: github
  releaseType: release
